<!DOCTYPE html>
<<html lang="en">
    <head>
        <meta charset="UTF=8"/>
        <meta name="viewport"content="width=device-width,initialize"/>
        <title>For You</title>
        <link href="https://fonts.googleapis.com/css2?family=Indie+flower&family=patrick+hand&family=monteserrat:wght@400;600;800&display=swap"rel="stylesheet"/>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <div id="bg-container"></div></div>
        <div class="tape"></div>
        <div class="tape"></div>
        <div class="poem-container">
            <div class="line">Roses are red,</div>
            <div class="line">Violets are blue,</div>
            <div class="line">Sugar is sweet,</div>
            <div class="line">But i still want you</div>
        </div>
        <div class="gif-area">
            <img src="gif//i-love-you-heart.gif"id=main-gif" alt="Cute Gif"/>
        </div>
        <p style="font-size: 14px;color:#888; margin-bottom: 20px;">Will you be my boyfriend</p>
        <div class="btn-group">
            <button class="yes-btn" id="yesBtn">YES</button>
            <button class="no-btn" id="noBtn">No</button>
        </div>
        <div class="success-screen" id="successScreen">
            <img src="https://i.giphy.com/media/g9582DNuQppxC/giphy.gif" class="main-gif" style="max-height: 200px; object-fit: contain; alt="cheers">
            <div class="success text">
                cheers!🥂<br>Best thing ever.
            </div>
            <p style="color: #888; margin-top: 15px">(I'll appreciate if you accept my request)</p>
        </div>
    </div>
    <script src="script.js"></script>
    </body>
</html>
