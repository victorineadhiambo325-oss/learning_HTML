<!DOCTYPE html>
<html>
  <head>
    <title>Age checker</title>
  </head>
  <body>
    <h1>Age checker</h1>
    <button onclick="checkage()">check age</button>
    <script>
      function checkage(){
        let age=20;
        if (age>=18){
          alert("you are an adult");
        }
      else{
        alert("you are under 18");
      }
      }
    </script>
  </body>
</html>
