<DOCTYPE html>
  <html>
    <head>
      <title>MY TABLE</title>
      <style>
        table{
          border-collapse: collapse;
          width: 70%;
        }
        th, td{
          border: 1px solid black;
          padding:10px ;
          text-align: center;
        }
        th{
          background-color: lightblue;
        }
      </style>
    </head>
    <body>
      <h1>Student results</h1>
      <table>
        <tr>
          <th>Name</th>
          <th>Course</th>
          <th>year</th>
        </tr>
        <tr>
          <td>victorine</td>
          <td>ICTM</td>
          <td>3</td>
        </tr>
        <tr>
          <td>brian</td>
          <td>computer science</td>
          <td>4</td>
        </tr>
      </table>
    </body>
  </html>
