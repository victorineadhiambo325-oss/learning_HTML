<!DOCTYPE html>
<html>
  <head>
    <title>My calculator</title>
  </head>
  <body>
    <h1>simple calculator</h1>
    <button onclick="calculate()">calculate</button>
    <script>
      function calculate(){
        let number2=50;
        let number3=100;
        let result=number2+number3;
        alert(result);
      }
    </script>
  </body>
